---
zabbix_registration_enabled: false

zabbix_api_url: ""
zabbix_api_token: ""
zabbix_api_validate_certs: true
zabbix_api_timeout: 30

zabbix_managed: "{{ zabbix_agent_enabled | default(false) }}"  # noqa var-naming[no-role-prefix]

zabbix_host_groups: []  # noqa var-naming[no-role-prefix]
zabbix_templates:  # noqa var-naming[no-role-prefix]
  - Linux by Zabbix agent
zabbix_tags: []  # noqa var-naming[no-role-prefix]
zabbix_agent_interface:  # noqa var-naming[no-role-prefix]
  type: agent
  main: true
  useip: true
  port: "10050"

zabbix_registration_service_templates:
  svc_zabbix:
    - Zabbix server health

zabbix_registration_inventory_group: kanagawa01

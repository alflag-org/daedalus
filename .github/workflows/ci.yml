name: CI

"on":
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12.13"
          - "3.13.14"
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run tests
        run: pytest -q

      - name: Verify mise configuration is unchanged
        run: git diff --exit-code -- mise.toml mise.lock

  ansible-syntax:
    name: Ansible syntax
    runs-on: ubuntu-latest
    env:
      MISE_PYTHON_VERSION: "3.13.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Install Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r collections/requirements.yml -p collections

      - name: Check playbook syntax
        working-directory: ansible
        run: |
          ansible-playbook --syntax-check playbooks/site.yml
          ansible-playbook --syntax-check playbooks/bootstrap.yml
          ansible-playbook --syntax-check playbooks/cloudflare.yml

      - name: Run Ansible lint
        working-directory: ansible
        run: ansible-lint playbooks/site.yml playbooks/bootstrap.yml playbooks/cloudflare.yml

      - name: Lint workflows
        run: actionlint -shellcheck="$(command -v shellcheck)" .github/workflows/*.yml

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "daedalus"
version = "0.1.0"
description = "Atlas-operated infrastructure configuration runner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ansible-core>=2.18",
    "fire>=0.7",
    "PyYAML>=6.0",
]

[project.scripts]
infra = "daedalus.cli:main"

[tool.setuptools.packages.find]
where = ["modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
